app:
  name: Parkify
  env: development
  debug: true
  host: 127.0.0.1
  port: 5001
  secret_key: parkify-dev-secret

logging:
  level: DEBUG
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(request_id)s | %(message)s"

auth:
  password_min_length: 12
  argon2_time_cost: 2
  argon2_memory_kib: 19456
  argon2_parallelism: 1

cors:
  origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:4173
    - http://127.0.0.1:4173
